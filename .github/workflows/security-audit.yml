name: Security Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run security audit
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            output="$(pnpm audit --audit-level=high 2>&1)"
            code=$?
            printf '%s\n' "$output"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if printf '%s' "$output" | grep -Eq 'ERR_SOCKET_TIMEOUT|error \(500\)|ECONNRESET|ENOTFOUND'; then
              echo "Transient npm audit API error on attempt ${attempt}; retrying..."
              sleep $((attempt * 20))
              continue
            fi
            exit "$code"
          done
          echo "npm audit API stayed unreachable after retries"
          exit 1
