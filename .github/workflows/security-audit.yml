name: Security Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run security audit
        timeout-minutes: 1
        run: |
          set +e
          output="$(timeout 40 pnpm audit --audit-level=high 2>&1)"
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if [ "$code" -eq 124 ] || printf '%s' "$output" | grep -Eq 'ERR_SOCKET_TIMEOUT|ERR_PNPM_AUDIT_BAD_RESPONSE|Service Unavailable|error \(50[0-9]\)'; then
            echo "::warning::npm audit API unreachable; not failing this run on a registry outage"
            exit 0
          fi
          exit "$code"
